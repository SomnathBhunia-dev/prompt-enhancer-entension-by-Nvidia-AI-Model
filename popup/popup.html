<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Prompt Enhancer</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      width: 280px;
    }
    .container {
      padding: 20px;
      text-align: center;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>✨ Prompt Enhancer</h2>
    <p>Your AI assistant is ready. Click the magic button next to any text box to enhance your prompts instantly.</p>
    <div class="badge">System Active</div>
  </div>
</body>
</html>
